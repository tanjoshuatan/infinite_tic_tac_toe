<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Tic-Tac-Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <style>
        :root { --bg: #0a0a14; }
        body { background-color: var(--bg); user-select: none; -webkit-user-select: none; }
        .cell-main { transition: background-color 0.15s ease, box-shadow 0.15s ease; }
        .cell-main:hover {
            background-color: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }
        .board-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3),
                        0 0 60px rgba(99, 102, 241, 0.1),
                        0 0 0 2px rgba(99, 102, 241, 0.4);
        }
        .win-cell-highlight {
            animation: winPulse 1.2s ease-in-out infinite;
            box-shadow: inset 0 0 0 2px rgba(52, 211, 153, 0.9);
        }
        @keyframes winPulse {
            0%, 100% { background-color: rgba(52, 211, 153, 0.2); }
            50% { background-color: rgba(52, 211, 153, 0.45); }
        }
        @keyframes markPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .mark-pop {
            animation: markPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div x-data="infiniteTTT()" x-cloak class="flex flex-col items-center gap-5 w-full max-w-lg">
        
        <!-- Title -->
        <div class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">
                Infinite Tic‑Tac‑Toe
            </h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">
                Infinite wrapping board
            </p>
        </div>

        <!-- Turn indicator (hidden when game over) -->
        <div class="flex items-center gap-3 text-sm sm:text-base" x-show="!gameOver">
            <span class="text-slate-300">Turn:</span>
            <span class="font-bold text-lg transition-colors duration-200"
                  :class="currentPlayer === 'X' ? 'text-rose-400' : 'text-cyan-400'"
                  x-text="currentPlayer"></span>
            <span class="inline-block w-5 h-5 rounded-full border-2 transition-all duration-200"
                  :class="currentPlayer === 'X' ? 'border-rose-400 bg-rose-400/20' : 'border-cyan-400 bg-cyan-400/20'"></span>
        </div>

        <!-- Board grid – always visible -->
        <div class="relative inline-block p-1 rounded-xl">
            <div class="grid gap-[3px]" style="grid-template-columns: repeat(5, auto);">
                <template x-for="br in [0,1,2,3,4]" :key="'br-'+br">
                    <template x-for="bc in [0,1,2,3,4]" :key="'bc-'+bc">
                        <div class="grid rounded-sm transition-all duration-500"
                             style="grid-template-columns: repeat(3, auto); gap: 1px;"
                             :class="{
                                 'board-glow rounded-md': br === 2 && bc === 2,
                                 'opacity-70': getBoardDistance(br, bc) === 1,
                                 'opacity-35': getBoardDistance(br, bc) === 2,
                                 'opacity-100': getBoardDistance(br, bc) === 0,
                             }">
                            <template x-for="r in [0,1,2]" :key="'r-'+r">
                                <template x-for="c in [0,1,2]" :key="'c-'+c">
                                    <div class="w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center text-xs sm:text-sm font-bold relative transition-all duration-150"
                                         :class="{
                                             'cursor-pointer cell-main': br === 2 && bc === 2 && !gameOver && !board[r][c],
                                             'cursor-default': br !== 2 || bc !== 2 || gameOver || board[r][c],
                                             'bg-slate-800/60 border border-slate-700/50': true,
                                             'bg-slate-800/80 border-slate-600/60': br === 2 && bc === 2,
                                             'win-cell-highlight rounded-sm z-10': isWinningCell(r, c) && winner,
                                         }"
                                         @mouseenter="br === 2 && bc === 2 && !gameOver && !board[r][c] ? (hoveredRow = r, hoveredCol = c) : null"
                                         @mouseleave="br === 2 && bc === 2 ? (hoveredRow = null, hoveredCol = null) : null"
                                         @click="br === 2 && bc === 2 ? placeMark(r, c) : null">
                                        <span x-show="board[r][c] === 'X'" class="text-rose-400 mark-pop pointer-events-none">X</span>
                                        <span x-show="board[r][c] === 'O'" class="text-cyan-400 mark-pop pointer-events-none">O</span>
                                        <span x-show="!board[r][c] && hoveredRow === r && hoveredCol === c && !gameOver"
                                              class="pointer-events-none opacity-35"
                                              :class="currentPlayer === 'X' ? 'text-rose-300' : 'text-cyan-300'"
                                              x-text="currentPlayer"></span>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </template>
                </template>
            </div>
        </div>

        <!-- Reset button during play -->
        <button x-show="!gameOver && moves > 0"
                @click="resetGame()"
                class="text-xs text-slate-500 hover:text-slate-300 transition-colors underline underline-offset-4">
            Reset Game
        </button>

        <!-- Result card (below board, no overlay) -->
        <div x-show="gameOver"
             x-transition.scale.origin-top.duration.300ms
             class="w-full max-w-xs mx-auto mt-2 bg-slate-900/90 border border-slate-700 rounded-2xl p-5 text-center shadow-2xl">
            
            <!-- Icon -->
            <div class="mb-3">
                <template x-if="winner === 'X'">
                    <div class="w-12 h-12 mx-auto rounded-full bg-rose-500/20 border-2 border-rose-400 flex items-center justify-center">
                        <span class="text-2xl font-bold text-rose-400">X</span>
                    </div>
                </template>
                <template x-if="winner === 'O'">
                    <div class="w-12 h-12 mx-auto rounded-full bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center">
                        <span class="text-2xl font-bold text-cyan-400">O</span>
                    </div>
                </template>
                <template x-if="isDraw && !winner">
                    <div class="w-12 h-12 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center">
                        <span class="text-xl font-bold text-amber-400">½</span>
                    </div>
                </template>
            </div>

            <h2 class="text-xl font-bold text-white mb-1" x-show="winner">
                <span :class="winner === 'X' ? 'text-rose-400' : 'text-cyan-400'" x-text="winner"></span> Wins!
            </h2>
            <h2 class="text-xl font-bold text-amber-300 mb-1" x-show="isDraw && !winner">It's a Draw</h2>
            <p class="text-slate-400 text-xs mb-4" x-show="winner">Three in a row</p>
            <p class="text-slate-400 text-xs mb-4" x-show="isDraw && !winner">Board full — no winner</p>

            <button @click="resetGame()"
                    class="w-full py-2.5 px-4 rounded-xl font-semibold text-white transition-all duration-200 bg-indigo-600 hover:bg-indigo-500 active:scale-95 shadow-lg shadow-indigo-500/25 text-sm">
                Play Again
            </button>
            <p class="text-slate-600 text-xs mt-2" x-show="moves > 0">
                <span x-text="moves"></span> move<span x-show="moves !== 1">s</span>
            </p>
        </div>
    </div>

    <script>
        function infiniteTTT() {
            const WINNING_LINES = [
                [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
                [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
                [[0,0],[1,1],[2,2]], [[0,1],[1,2],[2,0]], [[0,2],[1,0],[2,1]],
                [[0,0],[1,2],[2,1]], [[0,1],[1,0],[2,2]], [[0,2],[1,1],[2,0]]
            ];

            const countFilled = (board) => {
                let cnt = 0;
                for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) if (board[r][c] !== null) cnt++;
                return cnt;
            };

            return {
                board: [
                    [null, null, null],
                    [null, null, null],
                    [null, null, null]
                ],
                currentPlayer: 'X',
                hoveredRow: null,
                hoveredCol: null,
                winner: null,
                winningCells: [],

                get moves() { return countFilled(this.board); },
                get isDraw() { return this.moves === 9 && this.winner === null; },
                get gameOver() { return this.winner !== null || this.isDraw; },

                getBoardDistance(br, bc) { return Math.max(Math.abs(br-2), Math.abs(bc-2)); },

                isWinningCell(row, col) {
                    if (!this.winner) return false;
                    return this.winningCells.some(([wr, wc]) => wr === row && wc === col);
                },

                placeMark(row, col) {
                    if (this.gameOver) return;
                    if (this.board[row][col] !== null) return;

                    this.board[row][col] = this.currentPlayer;

                    const winResult = this.checkWinner();
                    if (winResult) {
                        this.winner = winResult.player;
                        this.winningCells = winResult.cells;
                        this.hoveredRow = null; this.hoveredCol = null;
                        return;
                    }

                    if (this.moves === 9) {
                        this.hoveredRow = null; this.hoveredCol = null;
                        return;
                    }

                    this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                },

                checkWinner() {
                    for (const line of WINNING_LINES) {
                        const [a,b,c] = line;
                        const va = this.board[a[0]][a[1]];
                        const vb = this.board[b[0]][b[1]];
                        const vc = this.board[c[0]][c[1]];
                        if (va && va === vb && vb === vc) {
                            return { player: va, cells: line.map(([r,c])=>[r,c]) };
                        }
                    }
                    return null;
                },

                resetGame() {
                    this.board = [
                        [null,null,null],
                        [null,null,null],
                        [null,null,null]
                    ];
                    this.currentPlayer = 'X';
                    this.hoveredRow = null; this.hoveredCol = null;
                    this.winner = null; this.winningCells = [];
                }
            };
        }
    </script>
</body>
</html>
